<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administração — House LTD</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>

<body>

  <!-- LOGIN -->
  <section id="adminLogin" class="admin-login">

    <div class="login-card">

      <div class="login-logo">
        LTD
      </div>

      <h1>Administração</h1>

      <p>
        Digite seu código de acesso para entrar no painel.
      </p>

      <form id="loginForm">

        <input
          type="password"
          id="adminCode"
          placeholder="Código de administração"
          autocomplete="off"
          required
        >

        <button type="submit">
          Entrar
        </button>

      </form>

      <p id="loginError" class="login-error"></p>

    </div>

  </section>


  <!-- PAINEL -->
  <section id="adminPanel" class="admin-panel" style="display:none;">

    <header class="admin-header">

      <div>
        <span id="adminRole"></span>
        <h1 id="adminName">Administração LTD</h1>
      </div>

      <button id="logoutButton">
        Sair
      </button>

    </header>


    <main>

      <div class="admin-welcome">
        <h2>Bem-vindo(a), <span id="welcomeName"></span>!</h2>
        <p>Gerencie a House LTD por aqui.</p>
      </div>


      <section class="admin-stats">

        <div class="stat-card">
          <span>Solicitações</span>
          <strong id="pendingCount">0</strong>
        </div>

        <div class="stat-card">
          <span>Vagas abertas</span>
          <strong id="openVacanciesCount">0</strong>
        </div>

        <div class="stat-card">
          <span>Vagas fechadas</span>
          <strong id="closedVacanciesCount">0</strong>
        </div>

        <div class="stat-card">
          <span>Membros</span>
          <strong id="membersCount">0</strong>
        </div>

      </section>


      <nav class="admin-navigation">

        <button data-section="requests">
          Solicitações
        </button>

        <button data-section="vacancies">
          Vagas
        </button>

        <button data-section="members">
          Membros
        </button>

        <button data-section="admins">
          ADMs
        </button>

        <button data-section="chat">
          Chat
        </button>

        <button data-section="logs">
          Logs
        </button>

      </nav>


      <section id="requestsSection" class="admin-section">
        <h2>Solicitações</h2>
        <div id="requestsList"></div>
      </section>


      <section id="vacanciesSection" class="admin-section">
        <h2>Vagas</h2>
        <div id="vacanciesList"></div>
      </section>


      <section id="membersSection" class="admin-section">
        <h2>Membros</h2>
        <div id="membersList"></div>
      </section>


      <section id="adminsSection" class="admin-section">
        <h2>Administradores</h2>
        <div id="adminsList"></div>
      </section>


      <section id="chatSection" class="admin-section">
        <h2>Chat da Administração</h2>

        <div id="adminChatMessages"></div>

        <form id="chatForm">

          <input
            type="text"
            id="chatMessage"
            placeholder="Digite uma mensagem..."
            required
          >

          <button type="submit">
            Enviar
          </button>

        </form>
      </section>


      <section id="logsSection" class="admin-section">
        <h2>Logs</h2>
        <div id="logsList"></div>
      </section>

    </main>

  </section>


  <script src="app.js"></script>

</body>
          </html>
