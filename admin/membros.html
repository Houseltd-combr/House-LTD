<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membros — Painel ADM | HOUSE LTD</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/firebase-config.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>BUSCAR<span> MEMBRO</span></h1>
            <nav>
                <a href="painel.html">INÍCIO</a>
                <a href="solicitacoes.html">SOLICITAÇÕES</a>
                <a href="vagas.html">VAGAS</a>
                <a href="membros.html" style="color: #00a8ff; border-color: #00a8ff;">MEMBROS</a>
                <a href="#" id="btn-sair">SAIR</a>
            </nav>
        </header>

        <main>
            <div class="card" style="margin-bottom: 30px;">
                <h3 style="color: #00a8ff; margin-bottom: 15px;">🔍 Buscar Membro</h3>
                <label for="busca-telefone">ÚLTIMOS 4 DÍGITOS DO TELEFONE *</label>
                <input type="text" id="busca-telefone" maxlength="4" placeholder="____" style="max-width: 200px; font-size: 1.2em; letter-spacing: 5px; text-align: center;">
                <button onclick="buscarMembro()" class="btn btn-primary" style="margin-top: 15px;">🔍 BUSCAR</button>
            </div>

            <div id="resultado-busca" style="display: none;"></div>

            <div id="mensagem" style="text-align: center; padding: 30px; color: rgba(255,255,255,0.5);">
                Digite os 4 dígitos do telefone para buscar um membro.
            </div>
        </main>
    </div>

    <script type="module" src="../js/admin-membros.js"></script>
    <script>
        document.getElementById('btn-sair').addEventListener('click', () => {
            localStorage.removeItem('adminLogado');
            localStorage.removeItem('adminNome');
            localStorage.removeItem('adminCargo');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
