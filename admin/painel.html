<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo — HOUSE LTD</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <header style="text-align: center;">
            <h1>PAINEL <span>ADM</span></h1>
            <p style="font-size: 1em; color: #999; margin-top: 5px;">Bem-vindo, <span id="admin-nome">Admin</span></p>
            <nav style="margin-top: 20px;">
                <a href="painel.html">Início</a>
                <a href="solicitacoes.html">Solicitações</a>
                <a href="vagas-admin.html">Vagas</a>
                <a href="membros.html">Membros</a>
                <a href="#" id="btn-sair" style="border-color: #e50914;">Sair</a>
            </nav>
        </header>

        <main>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px;">
                <div class="card" style="text-align: center;">
                    <h3 style="font-size: 2.5em; color: #fff; margin-bottom: 5px;" id="stat-solicitacoes">0</h3>
                    <p style="color: #999;">Solicitações Pendentes</p>
                </div>
                <div class="card" style="text-align: center;">
                    <h3 style="font-size: 2.5em; color: #fff; margin-bottom: 5px;" id="stat-abertas">0</h3>
                    <p style="color: #999;">Vagas Abertas</p>
                </div>
                <div class="card" style="text-align: center;">
                    <h3 style="font-size: 2.5em; color: #fff; margin-bottom: 5px;" id="stat-fechadas">0</h3>
                    <p style="color: #999;">Vagas Fechadas</p>
                </div>
                <div class="card" style="text-align: center;">
                    <h3 style="font-size: 2.5em; color: #fff; margin-bottom: 5px;" id="stat-membros">0</h3>
                    <p style="color: #999;">Membros Ativos</p>
                </div>
            </div>

            <div class="card">
                <h2>📋 AÇÕES RECENTES</h2>
                <div id="logs-lista" style="color: #999; font-size: 0.9em;">
                    <p>Nenhuma ação registrada ainda.</p>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/admin-auth.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
