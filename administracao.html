<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>House LTD — Administração</title> <style> * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; font-family: Arial, sans-serif; background: #080b16; color: white; display: flex; justify-content: center; align-items: center; } .container { width: 90%; max-width: 420px; } .logo { text-align: center; margin-bottom: 25px; } .logo h1 { margin: 0; font-size: 32px; } .logo p { margin-top: 8px; color: #aaa; } .card { background: #111625; border: 1px solid #252c40; border-radius: 18px; padding: 25px; box-shadow: 0 10px 40px rgba(0,0,0,.4); } h2 { margin-top: 0; } label { display: block; margin-top: 15px; margin-bottom: 7px; color: #bbb; } input, select { width: 100%; padding: 13px; border-radius: 10px; border: 1px solid #30384e; background: #080b16; color: white; outline: none; } .password-box { position: relative; } .password-box input { padding-right: 50px; } .eye { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 18px; } button { width: 100%; margin-top: 20px; padding: 14px; border: none; border-radius: 10px; background: #6c5ce7; color: white; font-size: 16px; font-weight: bold; cursor: pointer; } button:hover { opacity: .9; } #loginStatus { text-align: center; margin-top: 15px; min-height: 20px; } .hidden { display: none; } .panel { width: 100%; max-width: 800px; } .welcome { background: #111625; border: 1px solid #252c40; border-radius: 18px; padding: 25px; margin-bottom: 15px; } .section { background: #111625; border: 1px solid #252c40; border-radius: 18px; padding: 25px; margin-bottom: 15px; } .logout { background: #d63031; margin-top: 10px; } .success { color: #55efc4; } .error { color: #ff7675; } </style> </head> <body> <!-- LOGIN --> <div class="container" id="loginScreen"> <div class="logo"> <h1>HOUSE LTD</h1> <p>Área Administrativa</p> </div> <div class="card"> <h2>Entrar</h2> <label>Nome</label> <input type="text" id="adminName" placeholder="Digite seu nome" autocomplete="off" > <label>Senha</label> <div class="password-box"> <input type="password" id="adminPassword" placeholder="Digite sua senha" > <span class="eye" id="eyeButton">👁️</span> </div> <button id="loginButton"> Entrar na administração </button> <div id="loginStatus"></div> </div> </div> <!-- PAINEL --> <div class="panel hidden" id="adminPanel"> <div class="welcome"> <h1>🏠 House LTD</h1> <p> Bem-vindo(a), <strong id="welcomeName"></strong>! </p> <p> Cargo: <strong id="welcomeRole"></strong> </p> <button class="logout" id="logoutButton"> Sair </button> </div> <div class="section"> <h2>📋 Solicitações</h2> <p> Área destinada às solicitações de personagens e recepção dos membros. </p> <button onclick="alert('Sistema de solicitações em desenvolvimento!')"> Ver solicitações </button> </div> <div class="section" id="ownerSection"> <h2>👑 Gerenciar Administradores</h2> <p> Esta área será utilizada para adicionar, remover e gerenciar os ADMs da House. </p> <button onclick="alert('Gerenciamento de ADMs em desenvolvimento!')"> Gerenciar ADMs </button> </div> </div> <script> /* ========================= DADOS DO DONO ========================= */ const ADMIN_NAME = "Aiko"; const ADMIN_PASSWORD = "YM7JQ7"; const ADMIN_ROLE = "Owner"; /* ========================= ELEMENTOS ========================= */ const loginScreen = document.getElementById("loginScreen"); const adminPanel = document.getElementById("adminPanel"); const nameInput = document.getElementById("adminName"); const passwordInput = document.getElementById("adminPassword"); const loginButton = document.getElementById("loginButton"); const loginStatus = document.getElementById("loginStatus"); const eyeButton = document.getElementById("eyeButton"); const welcomeName = document.getElementById("welcomeName"); const welcomeRole = document.getElementById("welcomeRole"); const logoutButton = document.getElementById("logoutButton"); /* ========================= MOSTRAR / OCULTAR SENHA ========================= */ eyeButton.addEventListener("click", function() { if (passwordInput.type === "password") { passwordInput.type = "text"; eyeButton.textContent = "🙈"; } else { passwordInput.type = "password"; eyeButton.textContent = "👁️"; } }); /* ========================= LOGIN ========================= */ loginButton.addEventListener("click", function() { const name = nameInput.value.trim(); const password = passwordInput.value; loginStatus.className = ""; if (!name || !password) { loginStatus.textContent = "⚠️ Preencha seu nome e sua senha."; loginStatus.className = "error"; return; } if ( name.toLowerCase() === ADMIN_NAME.toLowerCase() && password === ADMIN_PASSWORD ) { loginStatus.textContent = "✅ Login realizado!"; loginStatus.className = "success"; setTimeout(function() { loginScreen.classList.add("hidden"); adminPanel.classList.remove("hidden"); welcomeName.textContent = ADMIN_NAME; welcomeRole.textContent = ADMIN_ROLE; }, 400); } else { loginStatus.textContent = "❌ Nome ou senha incorretos."; loginStatus.className = "error"; } }); /* ========================= ENTER PARA LOGAR ========================= */ passwordInput.addEventListener("keydown", function(event) { if (event.key === "Enter") { loginButton.click(); } }); /* ========================= SAIR ========================= */ logoutButton.addEventListener("click", function() { adminPanel.classList.add("hidden"); loginScreen.classList.remove("hidden"); nameInput.value = ""; passwordInput.value = ""; loginStatus.textContent = ""; }); </script> </body> </html>
