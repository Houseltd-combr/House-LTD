<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f28a24"><title>Ficha • House LTD</title><link rel="stylesheet" href="style.css"></head>
<body><header class="topbar"><a class="brand" href="index.html">🍊 HOUSE LTD</a><button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">☰</button><nav id="mainNav"><a href="index.html">Início</a><a class="active" href="ficha.html">Ficha</a><a href="troca.html">Troca</a><a href="sobre.html">Sobre</a><a href="admin.html">Administração</a></nav></header>
<main class="page narrow"><p class="eyebrow">ENTRADA NA HOUSE</p><h1>Ficha de personagem</h1><p class="muted">Preencha os dados para enviar sua solicitação. A equipe analisará antes de confirmar a vaga.</p>
<form id="characterForm" class="panel form-grid">
<label>Nome ou apelido<input name="memberName" maxlength="60" required autocomplete="nickname"></label>
<label data-config-field="age">Idade<input name="age" type="number" min="13" max="99"></label>
<label data-config-field="phoneLast4">Últimos 4 dígitos do telefone<input name="phoneLast4" inputmode="numeric" pattern="[0-9]{4}" maxlength="4"></label>
<label>Personagem<input name="character" maxlength="80" required></label>
<label>Obra / fandom<input name="work" maxlength="80" required></label>
<label class="full" data-config-field="photoUrl">Link da foto do personagem (opcional)<input name="photoUrl" type="url" placeholder="https://..."></label>
<div class="full"><button class="btn primary" type="submit">Enviar ficha</button><p class="form-message" id="formMessage" role="status"></p></div>
</form></main><footer>HOUSE LTD 🍊</footer><script type="module" src="js/ficha.js"></script><script src="js/menu.js"></script></body></html>
