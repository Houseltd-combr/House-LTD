<script type="module"> import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js"; import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js"; const firebaseConfig = { apiKey: "AIzaSyAg4h7phK_shSp4oUT-PJMH_iKu6cjJ82Q", authDomain: "house-6dfc9.firebaseapp.com", projectId: "house-6dfc9", storageBucket: "house-6dfc9.firebasestorage.app", messagingSenderId: "184001079413", appId: "1:184001079413:web:de4df4327d2cabdd30703c" }; const app = initializeApp(firebaseConfig); const db = getFirestore(app); const characters = [ ["Naruto Uzumaki","Naruto"], ["Sasuke Uchiha","Naruto"], ["Sakura Haruno","Naruto"], ["Kakashi Hatake","Naruto"], ["Itachi Uchiha","Naruto"], ["Hinata Hyuga","Naruto"], ["Boruto Uzumaki","Boruto"], ["Sarada Uchiha","Boruto"], ["Mitsuki","Boruto"], ["Deku","My Hero Academia"], ["Bakugo Katsuki","My Hero Academia"], ["Shoto Todoroki","My Hero Academia"], ["Ochaco Uraraka","My Hero Academia"], ["Shinobu Kocho","Demon Slayer"], ["Tanjiro Kamado","Demon Slayer"], ["Gojo Satoru","Jujutsu Kaisen"], ["Yuji Itadori","Jujutsu Kaisen"], ["Megumi Fushiguro","Jujutsu Kaisen"] ]; let occupied = []; function escapeHtml(value) { return String(value ?? "").replace(/[&<>'"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", "'":"&#39;", '"':"&quot;" }[c])); } function setStatus(text, className = "status") { const el = document.getElementById("status"); el.className = className + " full"; el.textContent = text; } function render() { const closed = document.getElementById("closedCharacters"); const select = document.getElementById("personagem"); select.innerHTML = ` <option value="">Selecione um personagem</option> <option value="__custom__">✨ Quero ser outro personagem</option> `; characters.forEach(([name, anime]) => { if (!occupied.includes(name)) { const option = document.createElement("option"); option.value = name; option.textContent = `${name} — ${anime}`; select.appendChild(option); } }); if (!occupied.length) { closed.innerHTML = '<p class="request-empty">📭 Nenhum personagem foi fechado ainda.</p>'; } else { closed.innerHTML = occupied.map(name => { const item = characters.find(c => c[0] === name); return ` <article class="character"> <h3>${escapeHtml(name)}</h3> <p>${escapeHtml(item ? item[1] : "Personagem personalizado")}</p> <span class="badge occupied">🔒 FECHADO</span> </article> `; }).join(""); } } const characterSelect = document.getElementById("personagem"); const customWrap = document.getElementById("customWrap"); const customInput = document.getElementById("customPersonagem"); characterSelect.addEventListener("change", () => { const custom = characterSelect.value === "__custom__"; customWrap.style.display = custom ? "block" : "none"; customInput.required = custom; if (custom) { customInput.focus(); } }); document.getElementById("receptionForm").addEventListener("submit", async event => { event.preventDefault(); const name = document.getElementById("nome").value.trim(); const age = document.getElementById("idade").value; const anime = document.getElementById("anime").value.trim(); const message = document.getElementById("mensagem").value.trim(); let character = characterSelect.value; if (character === "__custom__") { character = customInput.value.trim(); } if (!name || !age || !character) { setStatus("⚠ Preencha os campos obrigatórios."); return; } if (occupied.includes(character)) { setStatus("⚠ Esse personagem já está ocupado."); return; } try { await addDoc(collection(db, "requests"), { name: name, age: Number(age), character: character, anime: anime, message: message, status: "Pendente", createdAt: serverTimestamp() }); setStatus( `✓ Solicitação enviada! ${character} aguarda aprovação da administração.` ); event.target.reset(); customWrap.style.display = "none"; customInput.required = false; } catch (error) { console.error("Erro ao enviar solicitação:", error); setStatus( "❌ Não foi possível enviar a solicitação. Tente novamente.", "admin-error" ); } }); /* PERSONAGENS FECHADOS Por enquanto estamos ouvindo a coleção "occupiedCharacters". Depois vamos fazer a aprovação da solicitação criar automaticamente o personagem nessa coleção. */ onSnapshot( collection(db, "occupiedCharacters"), snapshot => { occupied = snapshot.docs.map(doc => doc.id); render(); }, error => { console.error("Erro ao carregar personagens:", error); occupied = []; render(); } ); render(); </script>
