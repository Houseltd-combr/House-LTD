<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Vaga — HOUSE LTD</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/firebase-config.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>SOLICITAR<span>VAGA</span></h1>
            <p>Preencha os dados abaixo para se tornar membro</p>
            <nav>
                <a href="index.html">INÍCIO</a>
                <a href="vagas-abertas.html">VAGAS ABERTAS</a>
                <a href="vagas-fechadas.html">VAGAS FECHADAS</a>
                <a href="troca-personagem.html">TROCA</a>
            </nav>
        </header>

        <main>
            <div class="card">
                <form id="ficha-form">
                    <label for="nome">NOME / APELIDO</label>
                    <input type="text" id="nome" placeholder="Como gostaria de ser chamado...">

                    <label for="idade">IDADE *</label>
                    <input type="number" id="idade" required placeholder="Sua idade...">

                    <label for="telefone">ÚLTIMOS 4 DÍGITOS DO TELEFONE *</label>
                    <input type="text" id="telefone" required maxlength="4" placeholder="____">

                    <label for="personagem">PERSONAGEM *</label>
                    <input type="text" id="personagem" required placeholder="Nome do personagem...">

                    <label for="obra">OBRA / FANDOM *</label>
                    <input type="text" id="obra" required placeholder="Nome da obra...">

                    <label for="foto">FOTO DO PERSONAGEM *</label>
                    <input type="file" id="foto" accept="image/*" required>

                    <label for="mensagem">INFORMAÇÕES ADICIONAIS (OPCIONAL)</label>
                    <textarea id="mensagem" rows="4" placeholder="Algo que queira nos dizer..."></textarea>

                    <button type="submit" class="btn btn-primary">ENVIAR SOLICITAÇÃO</button>
                </form>
            </div>
        </main>

        <footer>
            <p>© 2026 HOUSE LTD — Todos os direitos reservados</p>
        </footer>
    </div>

    <script type="module" src="js/solicitacoes.js"></script>
</body>
</html>
