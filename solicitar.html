<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Solicitar Personagem | HOUSE LTD</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>

<body>

<div class="container">

    <header>
        <h1>SOLICITAR</h1>

        <p>
            Preencha os dados abaixo para reservar seu personagem!
        </p>
    </header>


    <main>

        <!-- =========================
             FORMULÁRIO
        ========================== -->

        <form id="form-solicitacao">

            <label for="nome">
                NOME COMPLETO *
            </label>

            <input
                type="text"
                id="nome"
                placeholder="Seu nome completo"
                required
            >


            <label for="telefone">
                ÚLTIMOS 4 DÍGITOS DO TELEFONE *
            </label>

            <input
                type="text"
                id="telefone"
                maxlength="4"
                inputmode="numeric"
                autocomplete="off"
                placeholder="____"
                required
            >


            <label for="personagem">
                NOME DO PERSONAGEM *
            </label>

            <input
                type="text"
                id="personagem"
                placeholder="Ex: Nejire Hadou"
                required
            >


            <label for="obra">
                OBRA / FANDOM *
            </label>

            <input
                type="text"
                id="obra"
                placeholder="Ex: My Hero Academia"
                required
            >


            <label for="foto">
                FOTO DO PERSONAGEM *
            </label>

            <input
                type="file"
                id="foto"
                accept="image/*"
                required
            >


            <!-- =========================
                 PRÉ-VISUALIZAÇÃO
            ========================== -->

            <div
                id="preview-container"
                style="display:none; margin:15px 0;"
            >

                <p>
                    ✅ Pré-visualização:
                </p>

                <img
                    id="preview-foto"
                    alt="Pré-visualização do personagem"
                    style="
                        max-width:150px;
                        max-height:150px;
                        border-radius:8px;
                        object-fit:cover;
                    "
                >

            </div>


            <label for="mensagem">
                MENSAGEM (opcional)
            </label>

            <textarea
                id="mensagem"
                rows="4"
                placeholder="Algo que queira nos dizer..."
            ></textarea>


            <button
                type="submit"
                id="btn-enviar"
            >
                ENVIAR SOLICITAÇÃO
            </button>

        </form>


        <!-- =========================
             MENSAGEM DE SUCESSO
        ========================== -->

        <div
            id="mensagem-sucesso"
            style="
                display:none;
                text-align:center;
                margin-top:30px;
                padding:25px;
            "
        >

            <h3>
                ✅ ENVIADO COM SUCESSO!
            </h3>

            <p>
                Sua solicitação foi enviada.
                Aguarde a aprovação!
            </p>

            <button
                type="button"
                id="btn-outra"
            >
                ENVIAR OUTRA
            </button>

        </div>

    </main>

</div>


<script>

/* =========================================================
   FIREBASE — HOUSE LTD
========================================================= */

const firebaseConfig = {

    apiKey: "AIzaSyCRUNymKVh-UxKkSvNEUZkzAjmRi_4_AQU",

    authDomain: "house-ltd.firebaseapp.com",

    projectId: "house-ltd",

    storageBucket: "house-ltd.firebasestorage.app",

    messagingSenderId: "821811124213",

    appId: "1:821811124213:web:c8dd2b2f1e1a41bcd632bc",

    measurementId: "G-P28WHBV9VB"

};


/* =========================================================
   INICIALIZAR FIREBASE
========================================================= */

let db;

try {

    firebase.initializeApp(firebaseConfig);

    db = firebase.firestore();

    console.log("✅ Firebase conectado.");

} catch (erro) {

    console.error(
        "❌ Erro ao iniciar Firebase:",
        erro
    );

}


/* =========================================================
   ELEMENTOS
========================================================= */

const form =
    document.getElementById("form-solicitacao");

const btnEnviar =
    document.getElementById("btn-enviar");

const btnOutra =
    document.getElementById("btn-outra");

const mensagemSucesso =
    document.getElementById("mensagem-sucesso");

const inputFoto =
    document.getElementById("foto");

const previewContainer =
    document.getElementById("preview-container");

const previewFoto =
    document.getElementById("preview-foto");

const inputTelefone =
    document.getElementById("telefone");


/* =========================================================
   TELEFONE — SOMENTE NÚMEROS
========================================================= */

inputTelefone.addEventListener(
    "input",
    function () {

        this.value = this.value
            .replace(/\D/g, "")
            .slice(0, 4);

    }
);


/* =========================================================
   PRÉ-VISUALIZAÇÃO DA FOTO
========================================================= */

inputFoto.addEventListener(
    "change",
    function () {

        const arquivo =
            this.files[0];

        if (!arquivo) {

            previewContainer.style.display =
                "none";

            previewFoto.src = "";

            return;
        }


        /* Limite de 10 MB */

        if (
            arquivo.size >
            10 * 1024 * 1024
        ) {

            alert(
                "❌ A imagem não pode ter mais de 10 MB."
            );

            this.value = "";

            previewContainer.style.display =
                "none";

            return;
        }


        const leitor =
            new FileReader();


        leitor.onload =
            function (evento) {

                previewFoto.src =
                    evento.target.result;

                previewContainer.style.display =
                    "block";

            };


        leitor.readAsDataURL(arquivo);

    }
);


/* =========================================================
   CLOUDINARY — HOUSE LTD
========================================================= */

async function enviarParaCloudinary(
    arquivo
) {

    /*
     * Cloudinary da House LTD
     */

    const cloudName =
        "gsqmelxb";

    const uploadPreset =
        "House LTD";


    const dados =
        new FormData();


    dados.append(
        "file",
        arquivo
    );


    dados.append(
        "upload_preset",
        uploadPreset
    );


    try {

        const resposta =
            await fetch(
                `https://api.cloudinary.com/v1_1/${cloudName}/image/upload`,
                {
                    method: "POST",
                    body: dados
                }
            );


        const resultado =
            await resposta.json();


        console.log(
            "Cloudinary:",
            resultado
        );


        if (!resposta.ok) {

            return {

                sucesso: false,

                erro:
                    resultado?.error?.message ||
                    "Erro no upload da imagem."

            };

        }


        if (
            !resultado.secure_url
        ) {

            return {

                sucesso: false,

                erro:
                    "O Cloudinary não retornou a imagem."

            };

        }


        return {

            sucesso: true,

            url: resultado.secure_url

        };


    } catch (erro) {

        console.error(
            "Erro Cloudinary:",
            erro
        );


        return {

            sucesso: false,

            erro:
                "Não foi possível conectar ao Cloudinary."

        };

    }

}


/* =========================================================
   ENVIAR SOLICITAÇÃO
========================================================= */

form.addEventListener(
    "submit",
    async function (evento) {

        evento.preventDefault();


        /* Evitar clique duplo */

        if (
            btnEnviar.disabled
        ) {
            return;
        }


        btnEnviar.disabled =
            true;


        const textoOriginal =
            btnEnviar.textContent;


        try {

            /* =============================================
               PEGAR VALORES
            ============================================= */

            const nome =
                document
                    .getElementById("nome")
                    .value
                    .trim();


            const telefone =
                document
                    .getElementById("telefone")
                    .value
                    .trim();


            const personagem =
                document
                    .getElementById("personagem")
                    .value
                    .trim();


            const obra =
                document
                    .getElementById("obra")
                    .value
                    .trim();


            const mensagem =
                document
                    .getElementById("mensagem")
                    .value
                    .trim();


            const arquivoFoto =
                inputFoto.files[0];


            /* =============================================
               VALIDAÇÃO
            ============================================= */

            if (
                !nome ||
                !telefone ||
                !personagem ||
                !obra ||
                !arquivoFoto
            ) {

                throw new Error(
                    "Preencha todos os campos obrigatórios."
                );

            }


            if (
                !/^\d{4}$/.test(
                    telefone
                )
            ) {

                throw new Error(
                    "Digite exatamente os 4 últimos dígitos do telefone."
                );

            }


            /* =============================================
               UPLOAD
            ============================================= */

            btnEnviar.textContent =
                "ENVIANDO FOTO...";


            const upload =
                await enviarParaCloudinary(
                    arquivoFoto
                );


            if (
                !upload.sucesso
            ) {

                throw new Error(
                    upload.erro
                );

            }


            /* =============================================
               FIRESTORE
            ============================================= */

            btnEnviar.textContent =
                "ENVIANDO SOLICITAÇÃO...";


            if (!db) {

                throw new Error(
                    "Firebase não foi inicializado."
                );

            }


            await db
                .collection(
                    "characterRequests"
                )
                .add({

                    nome: nome,

                    telefone: telefone,

                    personagem: personagem,

                    obra: obra,

                    foto: upload.url,

                    mensagem: mensagem,

                    status: "pendente",

                    data:
                        firebase.firestore
                            .FieldValue
                            .serverTimestamp()

                });


            /* =============================================
               SUCESSO
            ============================================= */

            form.reset();

            previewFoto.src = "";

            previewContainer.style.display =
                "none";

            form.style.display =
                "none";

            mensagemSucesso.style.display =
                "block";


        } catch (erro) {

            console.error(
                "❌ Erro na solicitação:",
                erro
            );


            alert(
                "❌ Não foi possível enviar a solicitação.\n\n" +
                erro.message
            );


        } finally {

            btnEnviar.disabled =
                false;

            btnEnviar.textContent =
                textoOriginal;

        }

    }
);


/* =========================================================
   ENVIAR OUTRA SOLICITAÇÃO
========================================================= */

btnOutra.addEventListener(
    "click",
    function () {

        form.reset();

        previewFoto.src = "";

        previewContainer.style.display =
            "none";

        mensagemSucesso.style.display =
            "none";

        form.style.display =
            "block";

    }
);

</script>

</body>
    </html>
