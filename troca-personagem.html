<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Troca de Personagem — HOUSE LTD</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/firebase-config.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>TROCA<span>PERSONAGEM</span></h1>
            <p>Solicitar troca de personagem</p>
            <nav>
                <a href="index.html">INÍCIO</a>
                <a href="vagas-abertas.html">VAGAS ABERTAS</a>
                <a href="vagas-fechadas.html">VAGAS FECHADAS</a>
                <a href="solicitar-vaga.html">SOLICITAR VAGA</a>
            </nav>
        </header>

        <main>
            <div class="card">
                <form id="troca-form">
                    <label for="personagem-atual">PERSONAGEM ATUAL *</label>
                    <input type="text" id="personagem-atual" required placeholder="Seu personagem atual...">

                    <label for="obra-atual">OBRA ATUAL *</label>
                    <input type="text" id="obra-atual" required placeholder="Obra do personagem atual...">

                    <label for="novo-personagem">NOVO PERSONAGEM *</label>
                    <input type="text" id="novo-personagem" required placeholder="Novo personagem...">

                    <label for="nova-obra">NOVA OBRA *</label>
                    <input type="text" id="nova-obra" required placeholder="Obra do novo personagem...">

                    <label for="nova-foto">NOVA FOTO *</label>
                    <input type="file" id="nova-foto" accept="image/*" required>

                    <button type="submit" class="btn btn-primary">ENVIAR SOLICITAÇÃO DE TROCA</button>
                </form>
            </div>
        </main>

        <footer>
            <p>© 2026 HOUSE LTD — Todos os direitos reservados</p>
        </footer>
    </div>

    <script type="module" src="js/troca.js"></script>
</body>
</html>
